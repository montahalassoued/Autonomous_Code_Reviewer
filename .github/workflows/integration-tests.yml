# File purpose: Manual-only run of tests/integration/: the tests that call the REAL
#   APIs (Groq, Gemini, Voyage, GitHub). It is separate from ci-cd.yml, which never calls the APIs.
# Inputs: workflow_dispatch only (Actions tab > integration-tests > Run workflow).
#   GitHub secrets: GROQ_API_KEY, GOOGLE_API_KEY, VOYAGE_API_KEY, and INTEGRATION_GITHUB_TOKEN.
#   INTEGRATION_GITHUB_TOKEN is a personal access token. It is NOT named GITHUB_TOKEN, because
#   GitHub reserves that name for the built-in workflow token and will not let you create a secret with it.
# Outputs: The pytest result in the job log.
#   WARNING: each run consumes API quota (Groq, Gemini, Voyage) and may hit rate limits or
#   cost money on paid tiers. It never runs on push or on pull requests.

name: integration-tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Real-API tests (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.INTEGRATION_GITHUB_TOKEN }}   # the app reads GITHUB_TOKEN from the env
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project requirements
        run: pip install -r requirements.txt

      # Runs the whole suite, as CLAUDE.md describes. Tests that need a key skip or fail if it is missing.
      - name: Run the full test suite (real API calls)
        run: python -m pytest tests/integration -q
