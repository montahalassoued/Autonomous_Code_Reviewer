# File purpose: Local multi-service orchestration for the durable review pipeline.
# Inputs: Environment variables from .env and the container image built from this repository.
# Outputs: Five containers on one network:
#   azurite  - local emulator of Azure Storage (review queue), data kept in a named volume
#   postgres - code index and review history (reviews table = webhook dedupe)
#   gateway  - Nginx reverse proxy, the only way in: http://localhost:8000 (infra/gateway/)
#   api      - FastAPI webhook receiver (verify, dedupe, enqueue, 202); no indexing, reached only through the gateway
#   worker   - python -m app.worker; builds the index once and consumes the queue
# The api and worker share one image and talk through Azurite and Postgres.

x-jobs-env: &jobs-env
  JOBS_BACKEND: azure
  DEDUPE_BACKEND: postgres
  # Local-only credentials of the postgres service below, not a secret.
  DATABASE_URL: postgresql://reviewer:reviewer@postgres:5432/reviewer
  # Azurite's standard dev account. The account name and key below are the
  # well-known PUBLIC defaults documented by Microsoft, not a secret. They only
  # work against the local emulator.
  # Kept on one line on purpose: YAML folding would insert spaces.
  AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://azurite:10001/devstoreaccount1;"

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    # Only the queue service (10001) is used. Hosts must be 0.0.0.0 so other
    # containers can reach it (default is loopback). --loose ignores unsupported
    # request headers; --skipApiVersionCheck lets newer SDKs connect.
    command: >-
      azurite-queue --location /data --queueHost 0.0.0.0
      --loose --skipApiVersionCheck
    ports:
      - "10001:10001"
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(10001,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    # pgvector build of Postgres 16, so "similar code" embeddings can be enabled later.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reviewer
      POSTGRES_PASSWORD: reviewer
      POSTGRES_DB: reviewer
    # Published so tests and psql on your machine can reach it at localhost:5432.
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewer -d reviewer"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  gateway:
    image: nginxinc/nginx-unprivileged:1.27.4-alpine
    # Same public port as before, so `ngrok http 8000` and the GitHub webhook URL don't change.
    ports:
      - "8000:8080"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # any (default, for ngrok) or github_hooks (only GitHub's webhook IPs; run the refresh script first).
      - ./infra/gateway/allowlist/${GATEWAY_WEBHOOK_ALLOWLIST:-any}.conf:/etc/nginx/allowlist.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    # Not published on your machine: only the gateway reaches it, on the compose network.
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      <<: *jobs-env
    depends_on:
      azurite:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      <<: *jobs-env
    volumes:
      - target_repo:/app/target_repo
    depends_on:
      azurite:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # The image HEALTHCHECK probes an HTTP port; the worker has none.
    healthcheck:
      disable: true
    restart: unless-stopped
    # Give an in-flight review time to finish before SIGKILL.
    stop_grace_period: 10m

  # Collects the api's /metrics and the worker's :9100 every 15 s (infra/monitoring/prometheus.yml).
  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # Localhost only: the metrics stay on this machine.
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  # The dashboard at http://localhost:3000, provisioned from infra/monitoring/grafana/.
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  azurite_data:
  postgres_data:
  target_repo:
  prometheus_data:
  grafana_data:
