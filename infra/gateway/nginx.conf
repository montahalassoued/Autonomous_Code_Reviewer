# The only public entry point: two routes reach the API, everything else gets 404.
# Mounted as /etc/nginx/conf.d/default.conf, so these lines sit inside nginx's http block.

# GitHub sends a few deliveries per push: 10 per second per IP with a burst of 20 never limits it.
limit_req_zone $binary_remote_addr zone=webhook_per_ip:10m rate=10r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
limit_conn_status 429;

# Docker's DNS, re-asked every 10s: a rebuilt api gets a new IP and would otherwise get 502 until a gateway restart.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api_upstream 64k;
    server api:8000 resolve;
    keepalive 8;
}

server {
    listen 8080;
    server_tokens off;

    # Same cap as the API's GITHUB_WEBHOOK_MAX_BODY_BYTES (5 MiB): nginx refuses bigger bodies with 413.
    client_max_body_size 5m;
    # Slow clients (slowloris) are cut off instead of holding connections open.
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;
    limit_conn connections_per_ip 20;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    # GitHub gives up on a delivery after 10s, so waiting longer for the API is useless.
    proxy_read_timeout 15s;

    add_header X-Content-Type-Options nosniff always;

    location = /webhook/github {
        # allowlist/any.conf (default) or allowlist/github_hooks.conf, picked by GATEWAY_WEBHOOK_ALLOWLIST.
        include /etc/nginx/allowlist.conf;
        limit_except POST {
            deny all;
        }
        limit_req zone=webhook_per_ip burst=20 nodelay;
        proxy_pass http://api;
    }

    location = /health {
        limit_except GET {
            deny all;
        }
        proxy_pass http://api;
    }

    location / {
        return 404;
    }
}
