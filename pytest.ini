# File purpose: pytest configuration for the whole test suite.
# Inputs: tests/unit (offline, no API keys) and tests/integration (real APIs).
# Outputs: test discovery rules and the "integration" marker.
[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_functions = test_*
markers =
    integration: calls real external APIs (Groq, Gemini, Voyage, GitHub) and uses quota. Auto-applied to tests/integration/.
