# File purpose: Render Blueprint - deploys this repo as a single web service.
# Inputs: this repo's Dockerfile, plus secret env vars set in the Render dashboard.
# Outputs: a deployed, publicly reachable instance of the FastAPI app.

services:
  - type: web
    name: autonomous-code-reviewer
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TARGET_REPO_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
